
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tony Mason's Timeless Monkey | ITIS3135 | Playing Cards</title>

    <link rel="icon" href="images/favicon.svg">
    <link rel="stylesheet" href="styles/default.css">

    <!-- Vicunadator Standards Checker -->
    <script
        src="https://divonbriesen.github.io/teaching/tools/standards-check.js"
        defer>
    </script>

    <!-- Accumulus Validation Checker -->
    <script
        src="https://lint.page/kit/4d0fe3.js"
        crossorigin="anonymous">
    </script>
</head>

<body>

    <!-- The div elements load shared header and footer components.
         The card-grid class organizes the themed images into a grid.
         The racing-card class styles each individual card. -->

    <div data-include="components/header.html"></div>

    <main>
        <h2>Playing Cards</h2>

        <section class="card-grid" aria-label="Speed Racer car collection">

            <figure class="racing-card">
                <img src="images/mach5.jpeg"
                     alt="Mach 5 racing car from Speed Racer"
                     width="250" height="180">
                <figcaption>Mach 5</figcaption>
            </figure>

            <figure class="racing-card">
                <img src="images/mammoth.jpeg"
                     alt="Mammoth Car from Speed Racer"
                     width="250" height="180">
                <figcaption>Mammoth Car</figcaption>
            </figure>

            <figure class="racing-card">
                <img src="images/shootingstar.jpeg"
                     alt="Shooting Star racing car from Speed Racer"
                     width="250" height="180">
                <figcaption>Shooting Star</figcaption>
            </figure>

            <figure class="racing-card">
                <img src="images/mach4.jpeg"
                     alt="Mach 4 racing car from Speed Racer"
                     width="250" height="180">
                <figcaption>Mach 4</figcaption>
            </figure>

            <figure class="racing-card">
                <img src="images/grx.jpeg"
                     alt="GRX racing car from Speed Racer"
                     width="250" height="180">
                <figcaption>GRX</figcaption>
            </figure>

            <figure class="racing-card">
                <img src="images/hydrophiidae.jpeg"
                     alt="Hydrophiidae racing car from Speed Racer"
                     width="250" height="180">
                <figcaption>Hydrophiidae</figcaption>
            </figure>

        </section>
    </main>

    <div data-include="components/footer.html"></div>

    <script src="scripts/HTMLInclude.min.js"></script>

</body>
</html>
